apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/leah648/devops-course-final-project.git
    targetRevision: main
    path: argocd/app-of-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
