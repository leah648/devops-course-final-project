apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: hello-world-dev
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://github.com/leah648/devops-course-final-project.git
      targetRevision: main
      path: helm/hello-world
      helm:
        releaseName: hello-world-dev
        valueFiles:
          - $values/environments/dev/values.yaml

    - repoURL: https://github.com/leah648/devops-course-final-project.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true